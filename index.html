<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Music Bot</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div class="logo">🎵 Music Bot</div>
    <button class="menu-btn">☰</button>
  </header>

  <main>

    <section class="hero">
      <h1>Welcome back 👋</h1>
      <p>Discover music and radio stations.</p>

      <div class="search-box">
        <span>🔎</span>
        <input
          id="searchInput"
          type="text"
          placeholder="Search music..."
        >
        <button onclick="searchMusic()">Search</button>
      </div>
    </section>


    <section>
      <div class="section-title">
        <h2>🔥 Popular</h2>
      </div>

      <div class="music-grid">

        <div class="music-card" onclick="playSong('Song One')">
          <div class="cover">🎵</div>
          <h3>Song One</h3>
          <p>Artist One</p>
          <button>▶</button>
        </div>

        <div class="music-card" onclick="playSong('Song Two')">
          <div class="cover">🎧</div>
          <h3>Song Two</h3>
          <p>Artist Two</p>
          <button>▶</button>
        </div>

        <div class="music-card" onclick="playSong('Song Three')">
          <div class="cover">🎶</div>
          <h3>Song Three</h3>
          <p>Artist Three</p>
          <button>▶</button>
        </div>

      </div>
    </section>


    <section>
      <div class="section-title">
        <h2>📻 Radio Stations</h2>
      </div>

      <div class="radio-list">

        <div class="radio-card">
          <div class="station-icon">🔴</div>

          <div class="station-info">
            <h3>Chill Radio</h3>
            <p>Relaxing music</p>
          </div>

          <button onclick="playRadio('Chill Radio')">
            ▶
          </button>
        </div>


        <div class="radio-card">
          <div class="station-icon">🟢</div>

          <div class="station-info">
            <h3>Pop Radio</h3>
            <p>Popular hits</p>
          </div>

          <button onclick="playRadio('Pop Radio')">
            ▶
          </button>
        </div>


        <div class="radio-card">
          <div class="station-icon">🔵</div>

          <div class="station-info">
            <h3>Lo-Fi Radio</h3>
            <p>Study & chill</p>
          </div>

          <button onclick="playRadio('Lo-Fi Radio')">
            ▶
          </button>
        </div>

      </div>
    </section>

  </main>


  <div id="player" class="player">

    <div class="player-info">
      <div id="playerCover">🎵</div>

      <div>
        <strong id="playerTitle">Nothing playing</strong>
        <small id="playerArtist">Music Bot</small>
      </div>
    </div>

    <div class="player-controls">
      <button onclick="previousSong()">⏮</button>
      <button id="playButton" onclick="togglePlay()">▶️</button>
      <button onclick="nextSong()">⏭</button>
    </div>

  </div>


  <nav class="bottom-nav">

    <button onclick="showHome()">
      🏠
      <span>Home</span>
    </button>

    <button onclick="focusSearch()">
      🔎
      <span>Search</span>
    </button>

    <button onclick="showSaved()">
      ❤️
      <span>Saved</span>
    </button>

  </nav>


  <script src="app.js"></script>

</body>
</html>
